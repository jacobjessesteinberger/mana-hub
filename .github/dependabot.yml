# Dependabot configuration for Mana Hub.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Strategy:
# - Check weekly to keep noise low.
# - Group minor + patch updates per ecosystem so we get one PR per week instead
#   of dozens. Major updates open as individual PRs so we review them deliberately.
# - Limit open PRs so an unattended week does not flood the repo.

version: 2
updates:
  # Dashboard (root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "scope/dashboard"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      dashboard-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Bridge connector
  - package-ecosystem: "npm"
    directory: "/bridge"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:15"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "scope/bridge"
    commit-message:
      prefix: "deps(bridge)"
      include: "scope"
    groups:
      bridge-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "scope/ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      gha-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
